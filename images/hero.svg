<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="経営者と社員、人生100年の時間軸を見つめる構成図">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F3F6F1"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#278D44" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#278D44" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3CB55E" stop-opacity=".25"/>
      <stop offset="60%" stop-color="#3CB55E" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#3CB55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#1a1a1a" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- Sun halo -->
  <circle cx="900" cy="280" r="280" fill="url(#sun)"/>
  <circle cx="900" cy="280" r="62" fill="#278D44" opacity=".88"/>
  <circle cx="900" cy="280" r="80" fill="none" stroke="#278D44" stroke-width="1.2" opacity=".5"/>

  <!-- Distant mountains -->
  <path d="M0 640 L120 580 L240 615 L360 555 L480 600 L600 540 L720 590 L840 545 L960 600 L1080 565 L1200 605 L1200 900 L0 900 Z" fill="url(#hill)"/>
  <path d="M0 640 L120 580 L240 615 L360 555 L480 600 L600 540 L720 590 L840 545 L960 600 L1080 565 L1200 605" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity=".5"/>

  <!-- Time horizon line -->
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#1a1a1a" stroke-width="1.2" opacity=".25" stroke-dasharray="3 8"/>

  <!-- Decade markers -->
  <g font-family="Bebas Neue, sans-serif" font-size="14" fill="#278D44" letter-spacing="2">
    <line x1="120" y1="700" x2="120" y2="715" stroke="#278D44" stroke-width="1.5"/><text x="120" y="735" text-anchor="middle">20</text>
    <line x1="320" y1="700" x2="320" y2="715" stroke="#278D44" stroke-width="1.5"/><text x="320" y="735" text-anchor="middle">40</text>
    <line x1="520" y1="700" x2="520" y2="715" stroke="#278D44" stroke-width="1.5"/><text x="520" y="735" text-anchor="middle">60</text>
    <line x1="720" y1="700" x2="720" y2="715" stroke="#278D44" stroke-width="1.5"/><text x="720" y="735" text-anchor="middle">80</text>
    <line x1="920" y1="700" x2="920" y2="715" stroke="#278D44" stroke-width="1.5"/><text x="920" y="735" text-anchor="middle">100</text>
  </g>

  <!-- Curve representing life trajectory -->
  <path d="M50 770 Q 250 660 480 660 T 950 540" fill="none" stroke="#278D44" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>
  <circle cx="50" cy="770" r="6" fill="#278D44"/>
  <circle cx="950" cy="540" r="8" fill="#1B6A17"/>

  <!-- Two figures: 経営者 (left, larger) -->
  <g transform="translate(360, 520)">
    <!-- Head -->
    <circle cx="0" cy="0" r="42" fill="#1a1a1a"/>
    <!-- Body -->
    <path d="M-65 80 Q-65 35 0 35 Q65 35 65 80 L60 200 L-60 200 Z" fill="#1a1a1a"/>
    <!-- Subtle inner accent -->
    <line x1="0" y1="60" x2="0" y2="180" stroke="#278D44" stroke-width="2.5" opacity=".55"/>
  </g>

  <!-- Smaller figure: 社員 (right) -->
  <g transform="translate(540, 555)">
    <circle cx="0" cy="0" r="34" fill="#2C2C2C"/>
    <path d="M-52 65 Q-52 28 0 28 Q52 28 52 65 L48 165 L-48 165 Z" fill="#2C2C2C"/>
    <line x1="0" y1="50" x2="0" y2="150" stroke="#278D44" stroke-width="2" opacity=".55"/>
  </g>

  <!-- Connecting bridge between figures -->
  <path d="M425 580 Q 480 545 510 575" fill="none" stroke="#278D44" stroke-width="2" stroke-linecap="round"/>
  <circle cx="467" cy="557" r="4" fill="#278D44"/>

  <!-- Editorial label top-left -->
  <g font-family="Cormorant Garamond, serif" fill="#1B6A17" letter-spacing="6">
    <text x="60" y="80" font-size="16" font-style="italic">— A Hundred-Year Life</text>
    <text x="60" y="108" font-size="11" fill="#1a1a1a" letter-spacing="4">JINSEI SHIEN KEIEI · CONCEPT</text>
  </g>

  <!-- Bottom right legend -->
  <g font-family="Bebas Neue, sans-serif" font-size="11" fill="#1a1a1a" letter-spacing="3">
    <line x1="1080" y1="850" x2="1140" y2="850" stroke="#278D44" stroke-width="2"/>
    <text x="1075" y="853" text-anchor="end">LIFE TRAJECTORY</text>
  </g>
</svg>
