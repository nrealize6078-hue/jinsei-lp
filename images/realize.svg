<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Realize club 福利厚生イメージ">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6F4EA"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#278D44" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#278D44" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg3)"/>

  <!-- Halo -->
  <circle cx="300" cy="200" r="190" fill="url(#halo)"/>

  <!-- Connecting curve under figures -->
  <path d="M40 270 Q 300 180 560 270" fill="none" stroke="#278D44" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 5 figures (a team) -->
  <g>
    <!-- Figure 1 -->
    <g transform="translate(110 240)">
      <circle cx="0" cy="0" r="22" fill="#1a1a1a"/>
      <path d="M-30 36 Q-30 14 0 14 Q30 14 30 36 L26 110 L-26 110 Z" fill="#1a1a1a"/>
    </g>
    <!-- Figure 2 -->
    <g transform="translate(200 220)">
      <circle cx="0" cy="0" r="26" fill="#2C2C2C"/>
      <path d="M-34 42 Q-34 16 0 16 Q34 16 34 42 L30 130 L-30 130 Z" fill="#2C2C2C"/>
    </g>
    <!-- Figure 3 (center, larger - 経営者) -->
    <g transform="translate(300 210)">
      <circle cx="0" cy="0" r="30" fill="#1a1a1a"/>
      <path d="M-40 48 Q-40 18 0 18 Q40 18 40 48 L36 140 L-36 140 Z" fill="#1a1a1a"/>
      <line x1="0" y1="40" x2="0" y2="125" stroke="#278D44" stroke-width="2.5" opacity=".7"/>
    </g>
    <!-- Figure 4 -->
    <g transform="translate(400 220)">
      <circle cx="0" cy="0" r="26" fill="#2C2C2C"/>
      <path d="M-34 42 Q-34 16 0 16 Q34 16 34 42 L30 130 L-30 130 Z" fill="#2C2C2C"/>
    </g>
    <!-- Figure 5 -->
    <g transform="translate(490 240)">
      <circle cx="0" cy="0" r="22" fill="#1a1a1a"/>
      <path d="M-30 36 Q-30 14 0 14 Q30 14 30 36 L26 110 L-26 110 Z" fill="#1a1a1a"/>
    </g>
  </g>

  <!-- Connecting dots above heads (network) -->
  <g fill="#278D44">
    <circle cx="110" cy="180" r="3"/>
    <circle cx="200" cy="160" r="3"/>
    <circle cx="300" cy="148" r="4"/>
    <circle cx="400" cy="160" r="3"/>
    <circle cx="490" cy="180" r="3"/>
  </g>
  <g stroke="#278D44" stroke-width="1" opacity=".55" fill="none">
    <line x1="110" y1="180" x2="200" y2="160"/>
    <line x1="200" y1="160" x2="300" y2="148"/>
    <line x1="300" y1="148" x2="400" y2="160"/>
    <line x1="400" y1="160" x2="490" y2="180"/>
  </g>

  <!-- Editorial labels -->
  <g font-family="Cormorant Garamond, serif" fill="#1B6A17" letter-spacing="4">
    <text x="32" y="46" font-size="13" font-style="italic">— Welfare for the Hundred-Year Life</text>
    <text x="32" y="66" font-family="Bebas Neue, sans-serif" font-size="10" fill="#1a1a1a" letter-spacing="3">REALIZE CLUB</text>
  </g>
</svg>
